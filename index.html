<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ZOOO: Hex Civilization Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #2f3640; }

    #webgl-canvas { width: 100%; height: 100%; position: absolute; left: 0; top: 0; z-index: 1; }

    /* Верхняя панель Civ-стиля */
    .top-ui {
      position: absolute; top: 16px; left: 0; width: 100%;
      padding: 0 24px; display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .civ-badge {
      pointer-events: auto;
      background: linear-gradient(180deg, #2c3e50, #1a252f);
      border: 2px solid #d4af37;
      padding: 8px 24px; border-radius: 20px;
      color: #f1c40f; font-weight: 900; font-size: 1.3rem;
      letter-spacing: 2px; box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    .btn-create {
      pointer-events: auto;
      background: linear-gradient(135deg, #e67e22, #d35400);
      border: 2px solid #f39c12; color: white;
      padding: 12px 28px; font-size: 1.1rem; font-weight: 800;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(211, 84, 0, 0.4);
      transition: all 0.2s;
    }
    .btn-create:active { transform: scale(0.96); }

    /* Табличка существа */
    #pet-info {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(26, 37, 47, 0.92); border: 2px solid #d4af37;
      border-radius: 25px; padding: 12px 30px; color: #ecf0f1;
      font-weight: 700; font-size: 1.15rem; display: none; z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;
    }

    /* Модальное окно рисования */
    #draw-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 25, 0.78); backdrop-filter: blur(8px);
      z-index: 100; display: flex; justify-content: center; align-items: center;
    }
    .modal-box {
      background: #ffffff; border-radius: 28px; padding: 24px;
      width: 92%; max-width: 440px; display: flex; flex-direction: column;
      align-items: center; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal-box h2 { font-size: 1.3rem; color: #2c3e50; }

    #paint-area {
      background: #f8f9fa; border: 3px dashed #bdc3c7;
      border-radius: 20px; touch-action: none; cursor: crosshair;
    }

    .palette { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .swatch.active { transform: scale(1.2); border-color: #2c3e50; }

    .fields { display: flex; gap: 10px; width: 100%; }
    .input-field {
      flex: 1; padding: 10px 14px; border-radius: 12px;
      border: 2px solid #bdc3c7; font-size: 1rem; outline: none; font-weight: 600;
    }

    .actions { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1; padding: 12px; border: none; border-radius: 14px;
      font-size: 1.05rem; font-weight: 800; cursor: pointer;
    }
    .btn-clear { background: #ecf0f1; color: #7f8c8d; }
    .btn-submit { background: #27ae60; color: white; }

    /* Оверлей генерации ИИ */
    #loading-toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #f1c40f; border: 2px solid #f1c40f;
      padding: 16px 32px; border-radius: 30px; font-weight: 800; font-size: 1.2rem;
      z-index: 200; display: none;
    }
  </style>

  <!-- Three.js + OrbitControls + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="top-ui">
    <div class="civ-badge">ZOOO • CIV VI WORLD</div>
    <button class="btn-create" id="open-creator">✨ Оживить 3D модель</button>
  </div>

  <div id="pet-info">Питомец: <span id="pet-name-label" style="color: #f1c40f;">—</span></div>
  <div id="loading-toast">🪄 ИИ лепит 3D фигурку из пластилина...</div>

  <div id="webgl-canvas"></div>

  <!-- Окно рисования -->
  <div id="draw-modal">
    <div class="modal-box" id="draw-card">
      <h2>🎨 Нарисуй зверушку</h2>
      <canvas id="paint-area" width="300" height="300"></canvas>

      <div class="palette" id="palette-bar"></div>

      <div class="fields">
        <input type="text" id="creature-name" class="input-field" placeholder="Имя..." value="Глинястик" maxlength="12">
        <select id="biome-selector" class="input-field">
          <option value="grass">🌱 Равнины</option>
          <option value="desert">🏜️ Пустыня</option>
          <option value="snow">❄️ Заснеженные Пики</option>
          <option value="hills">⛰️ Зеленые Холмы</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn btn-clear" id="btn-reset">Стереть</button>
        <button class="btn btn-submit" id="btn-spawn">Оживить в 3D!</button>
      </div>
    </div>
  </div>

  <script>
    /* ====================================================================
       1. КОНФИГУРАЦИЯ БЕСПЛАТНОГО AI (TRIPO3D / FALLBACK)
       ==================================================================== */
    // Получить бесплатный API-ключ можно на platform.tripo3d.ai
    // Если ключа нет, активируется мгновенная плавная пластилиновая 3D-экструзия
    const TRIPO_API_KEY = ""; 

    /* ====================================================================
       2. ХОЛСТ РИСОВАНИЯ
       ==================================================================== */
    const canvas = document.getElementById('paint-area');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDrawing = false;
    let strokeColor = '#e74c3c';

    const colors = ['#2c3e50', '#e74c3c', '#e67e22', '#2ecc71', '#3498db', '#9b59b6', '#795548', '#ffffff'];
    const palette = document.getElementById('palette-bar');

    colors.forEach((c, idx) => {
      const b = document.createElement('div');
      b.className = 'swatch' + (idx === 1 ? ' active' : '');
      b.style.background = c;
      b.onclick = () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        b.classList.add('active');
        strokeColor = c;
      };
      palette.appendChild(b);
    });

    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * (canvas.width / r.width),
        y: (e.clientY - r.top) * (canvas.height / r.height)
      };
    }

    function startDraw(e) {
      isDrawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      draw(e);
    }
    function stopDraw(e) {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.closePath();
      try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    }
    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = strokeColor;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    canvas.addEventListener('pointerdown', startDraw);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDraw);
    canvas.addEventListener('pointercancel', stopDraw);

    document.getElementById('btn-reset').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
    document.getElementById('draw-card').onpointerdown = (e) => e.stopPropagation();

    /* ====================================================================
       3. 3D МИР В СТИЛЕ CIVILIZATION VI (ГЕКСЫ И СТИЛИЗОВАННЫЙ PBR)
       ==================================================================== */
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bd8ff);
    scene.fog = new THREE.FogExp2(0x9bd8ff, 0.009);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 800);
    camera.position.set(0, 38, 48);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 10;
    controls.maxDistance = 120;

    // Освещение Civ VI: теплое контрастное солнце + атмосферный небесный свет
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d566e, 0.9);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff1cf, 1.3);
    sun.position.set(45, 60, 35);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -40;
    sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40;
    sun.shadow.camera.bottom = -40;
    scene.add(sun);

    // Палитра биомов
    const BIOME_COLORS = {
      grass:  [0x55efc4, 0x00b894, 0x1dd1a1],
      desert: [0xfbc531, 0xe1b12c, 0xf5cd79],
      snow:   [0xf5f6fa, 0xdcdde1, 0xecf0f1],
      hills:  [0x78e08f, 0x38ada9, 0x2ed573]
    };

    // Создание правильного шестигранного тайла (CylinderGeometry с 6 гранями)
    const HEX_RADIUS = 3.2;
    const hexHeight = 2.5;
    const hexGeo = new THREE.CylinderGeometry(HEX_RADIUS, HEX_RADIUS, hexHeight, 6);

    const hexTiles = [];

    function createHexGrid(radius) {
      const xOffset = HEX_RADIUS * 1.732;
      const zOffset = HEX_RADIUS * 1.5;

      for (let q = -radius; q <= radius; q++) {
        const r1 = Math.max(-radius, -q - radius);
        const r2 = Math.min(radius, -q + radius);
        for (let r = r1; r <= r2; r++) {
          const x = xOffset * (q + r/2);
          const z = zOffset * r;

          // Определяем биом по секторам координат
          let biome = 'grass';
          if (x > 6 && z < 0) biome = 'desert';
          else if (x > 0 && z > 6) biome = 'snow';
          else if (x < -6 && z > 0) biome = 'hills';

          // Случайный рельеф и высота
          const palette = BIOME_COLORS[biome];
          const color = palette[Math.floor(Math.random() * palette.length)];
          const heightVariation = Math.sin(q * 0.8) * Math.cos(r * 0.8) * 1.2;

          const mat = new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.8,
            metalness: 0.1
          });

          const tile = new THREE.Mesh(hexGeo, mat);
          tile.position.set(x, heightVariation - hexHeight/2, z);
          tile.receiveShadow = true;
          scene.add(tile);

          // Детализация гекса (деревья, кристаллы льда, скалы)
          decorateHex(biome, x, heightVariation, z);

          hexTiles.push({ x, z, biome, y: heightVariation });
        }
      }
    }

    function decorateHex(biome, x, y, z) {
      if (Math.abs(x) < 5 && Math.abs(z) < 5) return; // Свободный центр для спавна

      if (biome === 'hills') {
        // Хвойные стилизованные деревья
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.5), new THREE.MeshLambertMaterial({color: 0x5d4037}));
        const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.4, 5), new THREE.MeshLambertMaterial({color: 0x1e824c}));
        foliage.position.y = 1.6;
        trunk.position.set(x, y + 0.75, z);
        trunk.add(foliage);
        trunk.castShadow = true;
        scene.add(trunk);
      } else if (biome === 'snow') {
        // Ледяной пик
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2), new THREE.MeshStandardMaterial({color: 0xe0f7fa, roughness: 0.2}));
        rock.position.set(x, y + 0.8, z);
        rock.castShadow = true;
        scene.add(rock);
      } else if (biome === 'desert') {
        // Песчаный валун
        const boulder = new THREE.Mesh(new THREE.DodecahedronGeometry(1), new THREE.MeshLambertMaterial({color: 0xe67e22}));
        boulder.position.set(x, y + 0.6, z);
        boulder.castShadow = true;
        scene.add(boulder);
      }
    }

    createHexGrid(5);

    /* ====================================================================
       4. ПРЕВРАЩЕНИЕ РИСУНКА В 3D МОДЕЛЬ (ПЛАСТИЛИНОВЫЙ ЭФФЕКТ)
       ==================================================================== */
    const animals = [];
    const gltfLoader = new THREE.GLTFLoader();

    async function create3DAnimal(dataUrl, biome, name) {
      document.getElementById('loading-toast').style.display = 'block';

      // 1. Попытка вызвать бесплатный AI API (если настроен ключ)
      if (TRIPO_API_KEY) {
        try {
          const res = await fetch("https://api.tripo3d.ai/v2/openapi/task", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${TRIPO_API_KEY}`
            },
            body: JSON.stringify({
              type: "image_to_model",
              file: { type: "png", data: dataUrl.split(',')[1] },
              prompt: "cute clay toy, plasticine sculpture, stylized cartoon animal, smooth surface, vivid colors"
            })
          });
          const data = await res.json();
          // Опрос статуса и получение GLB...
        } catch (e) {
          console.warn("AI API недоступен, переключаемся на локальную генерацию:", e);
        }
      }

      // 2. Встроенный генератор: пластилиновый барельеф PBR с физическим сглаживанием
      setTimeout(() => {
        document.getElementById('loading-toast').style.display = 'none';
        buildPlasticineModel(dataUrl, biome, name);
      }, 700);
    }

    function buildPlasticineModel(dataUrl, biome, name) {
      const img = new Image();
      img.src = dataUrl;
      img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.needsUpdate = true;

        const group = new THREE.Group();

        // Пластилиновый шейдер PBR: легкий блеск, шероховатость как у слепленной глины
        const clayMaterial = new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          alphaTest: 0.1,
          roughness: 0.35,
          metalness: 0.05,
          side: THREE.DoubleSide
        });

        const geom = new THREE.BoxGeometry(3.6, 3.6, 0.7, 4, 4, 2);
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
        const mesh = new THREE.Mesh(geom, [rimMat, rimMat, rimMat, rimMat, clayMaterial, clayMaterial]);
        mesh.castShadow = true;
        mesh.position.y = 1.8;
        group.add(mesh);

        // Тень под моделью
        const shadow = new THREE.Mesh(
          new THREE.CircleGeometry(1.4, 16),
          new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.3 })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = 0.05;
        group.add(shadow);

        // Находим подходящий тайл для спавна
        const matchingTiles = hexTiles.filter(t => t.biome === biome);
        const targetTile = matchingTiles.length > 0 
          ? matchingTiles[Math.floor(Math.random() * matchingTiles.length)] 
          : { x: 0, z: 0, y: 0 };

        group.position.set(targetTile.x, targetTile.y, targetTile.z);
        scene.add(group);

        const animalObj = {
          root: group,
          mesh: mesh,
          name: name,
          biome: biome,
          speed: 0.035 + Math.random() * 0.02,
          targetTile: targetTile,
          timer: 0,
          bounceOffset: Math.random() * 10
        };

        animals.push(animalObj);
        mesh.userData = animalObj;

        // Фокус камеры
        controls.target.set(targetTile.x, targetTile.y + 1.5, targetTile.z);
      };
    }

    /* ====================================================================
       5. ЖИЗНЬ ЗВЕРЕЙ И АНИМАЦИЯ ПО ТАЙЛАМ CIV
       ==================================================================== */
    const clock = new THREE.Clock();

    function updateWorld() {
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();

      animals.forEach(a => {
        a.timer -= dt;
        if (a.timer <= 0) {
          // Ищем соседний гекс для прогулки
          const neighbors = hexTiles.filter(h => 
            Math.hypot(h.x - a.root.position.x, h.z - a.root.position.z) < HEX_RADIUS * 3
          );
          if (neighbors.length) {
            a.targetTile = neighbors[Math.floor(Math.random() * neighbors.length)];
          }
          a.timer = 4 + Math.random() * 4;
        }

        const targetPos = new THREE.Vector3(a.targetTile.x, a.targetTile.y, a.targetTile.z);
        const dir = new THREE.Vector3().subVectors(targetPos, a.root.position);
        dir.y = 0;

        if (dir.length() > 0.4) {
          dir.normalize();
          a.root.position.addScaledVector(dir, a.speed);
          
          const angle = Math.atan2(dir.x, dir.z);
          a.root.rotation.y = THREE.MathUtils.lerp(a.root.rotation.y, angle, 0.08);

          // Анимация пластилинового покачивания при ходьбе
          a.mesh.position.y = 1.8 + Math.abs(Math.sin(t * 8 + a.bounceOffset)) * 0.4;
          a.mesh.rotation.z = Math.sin(t * 8 + a.bounceOffset) * 0.12;
        } else {
          a.mesh.position.y = 1.8 + Math.sin(t * 2 + a.bounceOffset) * 0.08;
          a.mesh.rotation.z = 0;
        }
      });
    }

    /* ====================================================================
       6. КЛИКИ И ВЗАИМОДЕЙСТВИЕ
       ==================================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const petBadge = document.getElementById('pet-info');
    const petNameLabel = document.getElementById('pet-name-label');

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#draw-modal') || e.target.closest('.top-ui')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(scene.children, true);
      let found = false;

      for (let h of hits) {
        if (h.object.userData && h.object.userData.name) {
          const pet = h.object.userData;
          petNameLabel.textContent = `${pet.name} (${pet.biome.toUpperCase()})`;
          petBadge.style.display = 'block';

          // Радостный прыжок
          pet.mesh.position.y += 1.8;
          controls.target.copy(pet.root.position);
          found = true;
          break;
        }
      }
      if (!found && e.clientY > 90) petBadge.style.display = 'none';
    });

    /* ====================================================================
       7. УПРАВЛЕНИЕ ОКНАМИ
       ==================================================================== */
    const drawModal = document.getElementById('draw-modal');
    document.getElementById('open-creator').onclick = () => drawModal.style.display = 'flex';

    document.getElementById('btn-spawn').onclick = () => {
      const pData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const hasDrawn = pData.some((c, i) => i % 4 === 3 && c > 15);

      if (!hasDrawn) {
        alert("Пожалуйста, нарисуй фигурку на холсте!");
        return;
      }

      const name = document.getElementById('creature-name').value.trim() || "Пластилинка";
      const biome = document.getElementById('biome-selector').value;
      const dataUrl = canvas.toDataURL();

      drawModal.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      create3DAnimal(dataUrl, biome, name);
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function loop() {
      requestAnimationFrame(loop);
      updateWorld();
      controls.update();
      renderer.render(scene, camera);
    }
    loop();
  </script>
</body>
</html>
