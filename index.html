<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Волшебный 3D Зоопарк Рисунков</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif; 
      user-select: none; 
      -webkit-user-select: none;
    }
    body, html { 
      overflow: hidden; 
      background: #000; 
      width: 100%; 
      height: 100%; 
      position: fixed;
    }
    
    /* 3D Окно */
    #canvas-container { 
      width: 100%; 
      height: 100%; 
      position: absolute; 
      left: 0; 
      top: 0; 
      z-index: 1; 
    }

    /* Верхняя панель */
    .hud {
      position: absolute; 
      top: 0;
      left: 0;
      z-index: 10;
      pointer-events: none;
      display: flex; 
      justify-content: space-between;
      width: 100%; 
      padding: 16px;
    }
    .hud button {
      pointer-events: auto;
      background: #ff4757; 
      color: white; 
      border: none;
      padding: 12px 22px; 
      font-size: 1rem; 
      font-weight: bold;
      border-radius: 50px; 
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      touch-action: manipulation;
    }
    .hud button:active { transform: scale(0.95); }

    /* Табличка имени */
    #info-card {
      position: absolute; 
      bottom: 25px; 
      left: 50%; 
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95); 
      padding: 12px 26px;
      border-radius: 20px; 
      font-size: 1.1rem; 
      font-weight: bold;
      color: #2f3542; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: none; 
      z-index: 10; 
      text-align: center;
      pointer-events: none;
    }

    /* Модальное окно мастерской */
    #creator-modal {
      position: absolute; 
      z-index: 100;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(47, 53, 66, 0.75);
      backdrop-filter: blur(6px);
      display: flex; 
      justify-content: center; 
      align-items: center;
    }
    .workshop {
      background: #ffffff; 
      border-radius: 24px;
      padding: 20px; 
      width: 92%; 
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 12px;
      pointer-events: auto;
    }
    h2 { font-size: 1.3rem; color: #2f3542; }

    #paintCanvas {
      background: #f8f9fa; 
      border-radius: 16px;
      border: 3px dashed #ced6e0; 
      cursor: crosshair;
      touch-action: none; /* Запрещает браузеру перехватывать жесты рисования */
      display: block;
    }

    .palette { 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
      justify-content: center; 
      width: 100%;
    }
    .color-btn {
      width: 32px; 
      height: 32px; 
      border-radius: 50%;
      border: 3px solid #ffffff; 
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      touch-action: manipulation;
    }
    .color-btn.active { 
      transform: scale(1.15); 
      border-color: #2f3542; 
    }

    .tools { 
      display: flex; 
      gap: 8px; 
      width: 100%; 
      justify-content: space-between; 
    }
    .input-field {
      padding: 10px 12px; 
      border-radius: 12px; 
      border: 2px solid #ced6e0;
      font-size: 0.95rem; 
      outline: none;
      background: #fff;
    }
    input.input-field { width: 50%; }
    select.input-field { width: 48%; }

    .action-btns { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1; 
      padding: 12px; 
      border: none; 
      border-radius: 14px;
      font-size: 1rem; 
      font-weight: bold; 
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); }
    .btn-clear { background: #dfe4ea; color: #57606f; }
    .btn-create { background: #2ed573; color: white; }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="hud">
    <button id="open-paint-btn">✨ Нарисовать зверя</button>
    <button id="clear-all-btn" style="background: #747d8c; font-size: 0.85rem;">Сброс зоопарка</button>
  </div>

  <div id="info-card">Привет! Меня зовут <span id="card-name" style="color: #ff4757;">Зверь</span>! 🐾</div>

  <div id="canvas-container"></div>

  <!-- Окно рисования -->
  <div id="creator-modal">
    <div class="workshop" id="workshop-card">
      <h2>🎨 Нарисуй своего питомца</h2>
      
      <canvas id="paintCanvas" width="300" height="300"></canvas>

      <div class="palette" id="palette"></div>

      <div class="tools">
        <input type="text" id="animal-name" class="input-field" placeholder="Имя..." maxlength="12" value="Пушистик">
        <select id="biome-select" class="input-field">
          <option value="grass">🌱 Зелёные Луга</option>
          <option value="desert">🏜️ Песчаная Пустыня</option>
          <option value="snow">❄️ Снежная Тундра</option>
          <option value="forest">🌲 Густой Лес</option>
        </select>
      </div>

      <div class="action-btns">
        <button class="btn btn-clear" id="canvas-clear" type="button">Стереть</button>
        <button class="btn btn-create" id="spawn-btn" type="button">Оживить! 🪄</button>
      </div>
    </div>
  </div>

  <script>
    /* ====================================================================
       1. СИСТЕМА РИСОВАНИЯ (ПОДДЕРЖКА МЫШИ, ТАЧА И СТИЛУСА ЧЕРЕЗ POINTER)
       ==================================================================== */
    const pCanvas = document.getElementById('paintCanvas');
    const ctx = pCanvas.getContext('2d', { willReadFrequently: true });
    
    let painting = false;
    let currentColor = '#2ed573';
    let brushSize = 14;

    const colors = ['#2f3542', '#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#8B5A2B', '#ffffff'];
    const palette = document.getElementById('palette');

    colors.forEach((col, idx) => {
      const b = document.createElement('div');
      b.className = 'color-btn' + (idx === 3 ? ' active' : '');
      b.style.backgroundColor = col;
      
      b.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        currentColor = col;
      });
      palette.appendChild(b);
    });

    function getCoords(e) {
      const rect = pCanvas.getBoundingClientRect();
      const scaleX = pCanvas.width / rect.width;
      const scaleY = pCanvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function startDraw(e) {
      painting = true;
      pCanvas.setPointerCapture(e.pointerId);
      const pos = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      draw(e);
    }

    function stopDraw(e) {
      if (!painting) return;
      painting = false;
      ctx.closePath();
      try { pCanvas.releasePointerCapture(e.pointerId); } catch(err){}
    }

    function draw(e) {
      if (!painting) return;
      const pos = getCoords(e);

      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = currentColor;

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    pCanvas.addEventListener('pointerdown', startDraw);
    pCanvas.addEventListener('pointermove', draw);
    pCanvas.addEventListener('pointerup', stopDraw);
    pCanvas.addEventListener('pointercancel', stopDraw);

    document.getElementById('canvas-clear').addEventListener('click', (e) => {
      e.stopPropagation();
      ctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    });

    // Предотвращение прокликивания сквозь форму рисования в 3D сцену
    document.getElementById('workshop-card').addEventListener('pointerdown', (e) => e.stopPropagation());

    /* ====================================================================
       2. 3D МИР (THREE.JS)
       ==================================================================== */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0e2ff);
    scene.fog = new THREE.Fog(0xa0e2ff, 40, 110);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 24, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.maxDistance = 75;
    controls.minDistance = 8;

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x555555, 0.75);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 0.85);
    dirLight.position.set(25, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const BIOMES = {
      grass:  { center: new THREE.Vector3(-18, 0, -18), color: 0x7bed9f, name: "Зелёные Луга" },
      snow:   { center: new THREE.Vector3(18, 0, -18),  color: 0xf1f2f6, name: "Снежная Тундра" },
      desert: { center: new THREE.Vector3(18, 0, 18),   color: 0xf6b93b, name: "Песчаная Пустыня" },
      forest: { center: new THREE.Vector3(-18, 0, 18),  color: 0x38ada9, name: "Густой Лес" }
    };

    function initWorld() {
      Object.keys(BIOMES).forEach(k => {
        const b = BIOMES[k];
        const geo = new THREE.CylinderGeometry(20, 22, 3.5, 32);
        const mat = new THREE.MeshLambertMaterial({ color: b.color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(b.center.x, -1.75, b.center.z);
        mesh.receiveShadow = true;
        scene.add(mesh);

        // Декорации
        for (let i = 0; i < 5; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rad = 4 + Math.random() * 10;
          const x = b.center.x + Math.cos(ang) * rad;
          const z = b.center.z + Math.sin(ang) * rad;

          if (k === 'forest') {
            const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1.6), new THREE.MeshLambertMaterial({color: 0x795548}));
            const fol = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2.6, 5), new THREE.MeshLambertMaterial({color: 0x1e824c}));
            fol.position.y = 1.8;
            tr.position.set(x, 0.8, z);
            tr.add(fol);
            scene.add(tr);
          } else if (k === 'snow') {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7), new THREE.MeshLambertMaterial({color: 0xdff9fb}));
            rock.position.set(x, 0.5, z);
            scene.add(rock);
          } else if (k === 'desert') {
            const cact = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2), new THREE.MeshLambertMaterial({color: 0x2ed573}));
            cact.position.set(x, 1, z);
            scene.add(cact);
          } else {
            const bush = new THREE.Mesh(new THREE.SphereGeometry(0.7, 5, 5), new THREE.MeshLambertMaterial({color: 0x2ecc71}));
            bush.scale.set(1, 0.5, 1);
            bush.position.set(x, 0.35, z);
            scene.add(bush);
          }
        }
      });
    }
    initWorld();

    /* ====================================================================
       3. ПРЕВРАЩЕНИЕ РИСУНКА В ЖИВОЕ 3D СУЩЕСТВО
       ==================================================================== */
    const animals = [];

    function spawn3DAnimal(dataUrl, biomeKey, name) {
      const img = new Image();
      img.src = dataUrl;
      img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.needsUpdate = true;

        const geometry = new THREE.BoxGeometry(3.2, 3.2, 0.5, 2, 2, 1);
        const faceMat = new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          alphaTest: 0.1,
          roughness: 0.3
        });
        const sideMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });

        const mesh = new THREE.Mesh(geometry, [sideMat, sideMat, sideMat, sideMat, faceMat, faceMat]);
        mesh.castShadow = true;
        mesh.position.y = 1.6;

        const animalRoot = new THREE.Group();
        animalRoot.add(mesh);

        // Тень
        const shadow = new THREE.Mesh(
          new THREE.CircleGeometry(1.1, 16),
          new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = 0.03;
        animalRoot.add(shadow);

        const targetBiome = BIOMES[biomeKey] || BIOMES.grass;
        const sx = targetBiome.center.x + (Math.random() - 0.5) * 8;
        const sz = targetBiome.center.z + (Math.random() - 0.5) * 8;
        animalRoot.position.set(sx, 0, sz);

        scene.add(animalRoot);

        const data = {
          root: animalRoot,
          bodyMesh: mesh,
          name: name || "Дружок",
          biome: biomeKey,
          targetPos: new THREE.Vector3(sx, 0, sz),
          speed: 0.02 + Math.random() * 0.02,
          timer: 0,
          bounceOffset: Math.random() * 10
        };

        animals.push(data);
        mesh.userData = data;
      };
    }

    /* ====================================================================
       4. АНИМАЦИЯ И ПОВЕДЕНИЕ
       ==================================================================== */
    const clock = new THREE.Clock();

    function updateAnimals() {
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      animals.forEach(a => {
        a.timer -= delta;
        if (a.timer <= 0) {
          const center = BIOMES[a.biome].center;
          a.targetPos.set(
            center.x + (Math.random() - 0.5) * 14,
            0,
            center.z + (Math.random() - 0.5) * 14
          );
          a.timer = 3 + Math.random() * 4;
        }

        const dir = new THREE.Vector3().subVectors(a.targetPos, a.root.position);
        dir.y = 0;
        if (dir.length() > 0.4) {
          dir.normalize();
          a.root.position.addScaledVector(dir, a.speed);

          const targetAngle = Math.atan2(dir.x, dir.z);
          a.root.rotation.y = THREE.MathUtils.lerp(a.root.rotation.y, targetAngle, 0.06);

          a.bodyMesh.position.y = 1.6 + Math.abs(Math.sin(time * 7 + a.bounceOffset)) * 0.35;
          a.bodyMesh.rotation.z = Math.sin(time * 7 + a.bounceOffset) * 0.1;
        } else {
          a.bodyMesh.position.y = 1.6 + Math.sin(time * 2 + a.bounceOffset) * 0.08;
          a.bodyMesh.rotation.z = 0;
        }
      });
    }

    /* ====================================================================
       5. КЛИКИ И ВЗАИМОДЕЙСТВИЕ
       ==================================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoCard = document.getElementById('info-card');
    const cardName = document.getElementById('card-name');

    window.addEventListener('pointerup', (e) => {
      // Игнорируем клики по модалке и меню
      if (e.target.closest('#creator-modal') || e.target.closest('.hud')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children, true);

      let found = false;
      for (let hit of hits) {
        if (hit.object.userData && hit.object.userData.name) {
          const pet = hit.object.userData;
          cardName.textContent = `${pet.name} (${BIOMES[pet.biome].name})`;
          infoCard.style.display = 'block';
          hit.object.position.y += 1.2; // Прыжок от радости
          found = true;
          break;
        }
      }
      if (!found && e.clientY > 80) {
        infoCard.style.display = 'none';
      }
    });

    /* ====================================================================
       6. СОХРАНЕНИЕ В ПАМЯТИ
       ==================================================================== */
    function saveAnimals() {
      const data = animals.map(a => ({
        name: a.name,
        biome: a.biome,
        img: a.bodyMesh.material[4].map.image.src
      }));
      localStorage.setItem('magic_zoo_save', JSON.stringify(data));
    }

    function loadAnimals() {
      const raw = localStorage.getItem('magic_zoo_save');
      if (raw) {
        try {
          const list = JSON.parse(raw);
          list.forEach(i => spawn3DAnimal(i.img, i.biome, i.name));
        } catch(e) { console.error(e); }
      }
    }

    // Кнопка «Оживить»
    document.getElementById('spawn-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const pData = ctx.getImageData(0, 0, pCanvas.width, pCanvas.height).data;
      const isDrawn = pData.some((channel, i) => i % 4 === 3 && channel > 10);

      if (!isDrawn) {
        alert("Пожалуйста, нарисуй зверька на холсте!");
        return;
      }

      const name = document.getElementById('animal-name').value.trim() || "Чудо-зверь";
      const biome = document.getElementById('biome-select').value;
      const url = pCanvas.toDataURL();

      spawn3DAnimal(url, biome, name);

      document.getElementById('creator-modal').style.display = 'none';
      ctx.clearRect(0, 0, pCanvas.width, pCanvas.height);

      setTimeout(saveAnimals, 400);
    });

    document.getElementById('open-paint-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('creator-modal').style.display = 'flex';
    });

    document.getElementById('clear-all-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm("Очистить зоопарк? Все созданные звери исчезнут.")) {
        localStorage.removeItem('magic_zoo_save');
        animals.forEach(a => scene.remove(a.root));
        animals.length = 0;
        infoCard.style.display = 'none';
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      updateAnimals();
      controls.update();
      renderer.render(scene, camera);
    }

    loadAnimals();
    animate();
  </script>
</body>
</html>
