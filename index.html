<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ZOOO: Оживи свой рисунок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #80d4ff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* Верхний интерфейс */
    .top-bar {
      position: absolute;
      top: 16px; left: 0; width: 100%;
      padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .brand-group {
      display: flex; align-items: center; gap: 12px; pointer-events: auto;
    }
    .logo {
      font-size: 1.8rem; font-weight: 900;
      color: #fff; text-shadow: 0 4px 12px rgba(0,0,0,0.25);
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      padding: 8px 20px; border-radius: 30px;
      box-shadow: 0 6px 16px rgba(255, 71, 87, 0.4);
      letter-spacing: 1px;
    }
    .action-group {
      display: flex; gap: 12px; pointer-events: auto;
    }
    .btn-icon {
      background: #ffffff; border: none; width: 50px; height: 50px;
      border-radius: 50%; font-size: 1.4rem; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-icon:active { transform: scale(0.9); }
    
    .btn-create-main {
      pointer-events: auto;
      background: linear-gradient(135deg, #2ed573, #10ac84);
      color: white; border: none;
      padding: 12px 24px; font-size: 1.1rem; font-weight: 800;
      border-radius: 40px; cursor: pointer;
      box-shadow: 0 8px 25px rgba(46, 213, 115, 0.45);
      transition: transform 0.2s;
    }
    .btn-create-main:active { transform: scale(0.95); }

    /* Табличка выбранного зверя */
    #pet-badge {
      position: absolute; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 12px 24px; border-radius: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      display: flex; align-items: center; gap: 16px;
      opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }
    #pet-badge.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    .btn-feed {
      background: #ffa502; color: white; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 10px rgba(255, 165, 2, 0.4);
      transition: transform 0.15s;
    }
    .btn-feed:active { transform: scale(0.92); }

    /* Окно мастерской рисования */
    #draw-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex; justify-content: center; align-items: center;
    }
    .art-board {
      background: #ffffff;
      width: 92%; max-width: 460px;
      border-radius: 32px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .art-board h3 { font-size: 1.3rem; color: #2f3542; }

    #paint-area {
      background: #f8fafc;
      border: 3px dashed #cbd5e1;
      border-radius: 22px;
      touch-action: none;
      cursor: crosshair;
    }

    .palette {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%;
    }
    .color-swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid #fff; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.15s;
    }
    .color-swatch.selected { transform: scale(1.22); border-color: #1e293b; }

    .meta-row {
      display: flex; gap: 8px; width: 100%;
    }
    .input-box {
      flex: 1; padding: 10px 14px; border-radius: 14px;
      border: 2px solid #e2e8f0; font-size: 0.95rem;
      outline: none; background: #fff; font-weight: 700;
    }
    .btn-row {
      display: flex; gap: 10px; width: 100%; margin-top: 4px;
    }
    .btn-ui {
      flex: 1; padding: 12px; border: none; border-radius: 16px;
      font-size: 1.05rem; font-weight: 800; cursor: pointer;
    }
    .btn-ghost { background: #e2e8f0; color: #64748b; }
    .btn-magic {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: white; box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
    }

    /* Вспышка для фото-режима */
    #photo-flash {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: white; opacity: 0; pointer-events: none; z-index: 200;
      transition: opacity 0.25s ease-out;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="photo-flash"></div>

  <div class="top-bar" id="top-bar">
    <div class="brand-group">
      <div class="logo">ZOOO</div>
      <button class="btn-icon" id="btn-photo" title="Сделать снимок">📸</button>
      <button class="btn-icon" id="btn-audio" title="Включить звук">🔇</button>
    </div>
    <div class="action-group">
      <button class="btn-create-main" id="btn-open-draw">✨ Оживить зверя</button>
    </div>
  </div>

  <div id="pet-badge">
    <span style="font-size: 1.8rem;" id="badge-icon">🐾</span>
    <div>
      <div id="badge-name" style="font-weight:900; color:#2f3542;">Имя</div>
      <div id="badge-biome" style="font-size: 0.85rem; color: #64748b;">Биом</div>
    </div>
    <button class="btn-feed" id="btn-feed-pet">🍎 Покормить</button>
  </div>

  <div id="webgl-canvas"></div>

  <!-- Окно создания -->
  <div id="draw-modal">
    <div class="art-board" id="art-card">
      <h3>🎨 Нарисуй жителя зоопарка</h3>
      
      <canvas id="paint-area" width="300" height="300"></canvas>

      <div class="palette" id="colors"></div>

      <div class="meta-row">
        <input type="text" id="name-input" class="input-box" placeholder="Как назовём?" maxlength="12" value="Дракоша">
        <select id="biome-input" class="input-box" style="flex: 1.1;">
          <option value="grass">🌱 Равнины и Луга</option>
          <option value="desert">🏜️ Золотая Пустыня</option>
          <option value="snow">❄️ Вечные Льды</option>
          <option value="forest">🌲 Сказочный Лес</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn-ui btn-ghost" id="btn-erase">Очистить</button>
        <button class="btn-ui btn-magic" id="btn-animate">Оживить! 🪄</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. ЗВУКОВОЙ ДВИЖОК (WEB AUDIO API)
       ========================================================== */
    let audioCtx = null;
    let isSoundOn = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    document.getElementById('btn-audio').onclick = () => {
      initAudio();
      isSoundOn = !isSoundOn;
      document.getElementById('btn-audio').textContent = isSoundOn ? '🔊' : '🔇';
    };

    function playTone(freq, type, duration, gainLevel = 0.1) {
      if (!isSoundOn || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundStroke() { playTone(300 + Math.random() * 200, 'sine', 0.08, 0.03); }
    function soundMagic() {
      if (!isSoundOn || !audioCtx) return;
      [400, 600, 800, 1000, 1200].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'triangle', 0.25, 0.1), idx * 80);
      });
    }
    function soundPetJoy() {
      if (!isSoundOn || !audioCtx) return;
      playTone(550, 'sine', 0.12, 0.12);
      setTimeout(() => playTone(880, 'sine', 0.2, 0.15), 100);
    }
    function soundEat() {
      if (!isSoundOn || !audioCtx) return;
      playTone(250, 'square', 0.1, 0.08);
      setTimeout(() => playTone(350, 'square', 0.15, 0.08), 90);
    }

    /* ==========================================================
       2. СИСТЕМА РИСОВАНИЯ
       ========================================================== */
    const canvas = document.getElementById('paint-area');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let painting = false;
    let currentColor = '#ff4757';

    const colorList = ['#2f3542', '#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#a55eea', '#795548', '#ffffff'];
    const colContainer = document.getElementById('colors');

    colorList.forEach((col, i) => {
      const dot = document.createElement('div');
      dot.className = 'color-swatch' + (i === 1 ? ' selected' : '');
      dot.style.background = col;
      dot.onclick = () => {
        initAudio();
        document.querySelectorAll('.color-swatch').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        currentColor = col;
      };
      colContainer.appendChild(dot);
    });

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = canvas.width / rect.width;
      const sy = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
    }

    function onPointerDown(e) {
      initAudio();
      painting = true;
      canvas.setPointerCapture(e.pointerId);
      const p = getPointerPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      drawStroke(e);
    }
    function onPointerUp(e) {
      if (!painting) return;
      painting = false;
      ctx.closePath();
      try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
    }
    function drawStroke(e) {
      if (!painting) return;
      const p = getPointerPos(e);
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = currentColor;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      if (Math.random() < 0.2) soundStroke();
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', drawStroke);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);

    document.getElementById('btn-erase').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('art-card').onpointerdown = (e) => e.stopPropagation();

    /* ==========================================================
       3. 3D СЦЕНА (THREE.JS)
       ========================================================== */
    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa7ebff);
    scene.fog = new THREE.FogExp2(0xa7ebff, 0.011);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 32, 54);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.maxDistance = 100;
    controls.minDistance = 8;

    const hemi = new THREE.HemisphereLight(0xffffff, 0x556677, 0.9);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff6e5, 1.15);
    sun.position.set(40, 60, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    const BIOMES = {
      grass:  { x: -24, z: -24, col: 0x78e08f, name: "Равнины и Луга" },
      desert: { x: 24,  z: -24, col: 0xf6b93b, name: "Золотая Пустыня" },
      snow:   { x: 24,  z: 24,  col: 0xf1f2f6, name: "Вечные Льды" },
      forest: { x: -24, z: 24,  col: 0x38ada9, name: "Сказочный Лес" }
    };

    function buildIsland() {
      // Пьедестал оживления
      const centerPedestal = new THREE.Mesh(
        new THREE.CylinderGeometry(5, 6, 1.4, 32),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
      );
      centerPedestal.position.y = 0.5;
      centerPedestal.receiveShadow = true;
      scene.add(centerPedestal);

      Object.keys(BIOMES).forEach(key => {
        const b = BIOMES[key];
        const islandGeo = new THREE.CylinderGeometry(24, 26, 4, 32);
        const islandMat = new THREE.MeshLambertMaterial({ color: b.col });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.set(b.x, -1.5, b.z);
        island.receiveShadow = true;
        scene.add(island);

        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 5 + Math.random() * 14;
          const px = b.x + Math.cos(angle) * dist;
          const pz = b.z + Math.sin(angle) * dist;

          if (key === 'forest') {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.8), new THREE.MeshLambertMaterial({color: 0x5d4037}));
            const crown = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3, 5), new THREE.MeshLambertMaterial({color: 0x009432}));
            crown.position.y = 2.2;
            trunk.position.set(px, 0.9, pz);
            trunk.add(crown);
            crown.castShadow = true;
            scene.add(trunk);
          } else if (key === 'snow') {
            const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1 + Math.random()*0.5), new THREE.MeshStandardMaterial({color: 0xdff9fb, roughness: 0.1}));
            crystal.position.set(px, 1, pz);
            crystal.castShadow = true;
            scene.add(crystal);
          } else if (key === 'desert') {
            const rock = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2.5, 4), new THREE.MeshLambertMaterial({color: 0xe58e26}));
            rock.position.set(px, 1.25, pz);
            rock.castShadow = true;
            scene.add(rock);
          } else {
            const flower = new THREE.Mesh(new THREE.SphereGeometry(0.7, 6, 6), new THREE.MeshLambertMaterial({color: 0xff6b81}));
            flower.scale.set(1, 0.5, 1);
            flower.position.set(px, 0.5, pz);
            scene.add(flower);
          }
        }
      });
    }
    buildIsland();

    /* ==========================================================
       4. СИСТЕМА ЧАСТИЦ (СЕРДЕЧКИ / ИСКРЫ РАДОСТИ)
       ========================================================== */
    const particlePool = [];
    function spawnLoveParticles(pos) {
      const pCount = 20;
      const geom = new THREE.BufferGeometry();
      const positions = [];
      const velocities = [];

      for(let i = 0; i < pCount; i++) {
        positions.push(pos.x, pos.y + 1.5, pos.z);
        velocities.push(
          (Math.random() - 0.5) * 0.15,
          0.1 + Math.random() * 0.15,
          (Math.random() - 0.5) * 0.15
        );
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xff3838,
        size: 0.6,
        transparent: true,
        opacity: 1
      });

      const pSystem = new THREE.Points(geom, mat);
      scene.add(pSystem);

      particlePool.push({
        system: pSystem,
        velocities: velocities,
        life: 1.0
      });
    }

    function updateParticles(dt) {
      for(let i = particlePool.length - 1; i >= 0; i--) {
        const p = particlePool[i];
        p.life -= dt * 1.2;
        const posAttr = p.system.geometry.attributes.position;
        const arr = posAttr.array;

        for(let j = 0; j < arr.length / 3; j++) {
          arr[j * 3] += p.velocities[j * 3];
          arr[j * 3 + 1] += p.velocities[j * 3 + 1];
          arr[j * 3 + 2] += p.velocities[j * 3 + 2];
        }
        posAttr.needsUpdate = true;
        p.system.material.opacity = p.life;

        if (p.life <= 0) {
          scene.remove(p.system);
          p.system.geometry.dispose();
          p.system.material.dispose();
          particlePool.splice(i, 1);
        }
      }
    }

    /* ==========================================================
       5. СОЗДАНИЕ И ПОВЕДЕНИЕ ЗВЕРЕЙ
       ========================================================== */
    const animals = [];
    let selectedPet = null;

    function makeVolumetricAnimal(imgUrl, biomeKey, name, onComplete) {
      const img = new Image();
      img.src = imgUrl;
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.needsUpdate = true;

        const group = new THREE.Group();

        const frontMat = new THREE.MeshStandardMaterial({
          map: tex,
          transparent: true,
          alphaTest: 0.1,
          roughness: 0.3,
          side: THREE.DoubleSide
        });

        const planeGeo = new THREE.PlaneGeometry(3.6, 3.6);
        
        const frontMesh = new THREE.Mesh(planeGeo, frontMat);
        frontMesh.position.z = 0.25;
        frontMesh.castShadow = true;
        group.add(frontMesh);

        const backMesh = new THREE.Mesh(planeGeo, frontMat);
        backMesh.position.z = -0.25;
        backMesh.rotation.y = Math.PI;
        backMesh.castShadow = true;
        group.add(backMesh);

        const shadow = new THREE.Mesh(
          new THREE.CircleGeometry(1.3, 16),
          new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = 0.05;
        group.add(shadow);

        group.position.set(0, 1.5, 0);
        scene.add(group);

        const targetBiome = BIOMES[biomeKey] || BIOMES.grass;
        const finalX = targetBiome.x + (Math.random() - 0.5) * 12;
        const finalZ = targetBiome.z + (Math.random() - 0.5) * 12;

        const animalObj = {
          root: group,
          frontMesh: frontMesh,
          name: name,
          biome: biomeKey,
          target: new THREE.Vector3(finalX, 0, finalZ),
          state: 'spawning',
          timeOffset: Math.random() * 20,
          speed: 0.035 + Math.random() * 0.02
        };

        animals.push(animalObj);
        frontMesh.userData = animalObj;
        backMesh.userData = animalObj;

        if (onComplete) onComplete(animalObj);
      };
    }

    const clock = new THREE.Clock();

    function updateLivingWorld() {
      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      updateParticles(dt);

      animals.forEach(a => {
        if (a.state === 'spawning') {
          a.root.position.y = THREE.MathUtils.lerp(a.root.position.y, 2.5, 0.05);
          a.root.rotation.y += 0.04;
          a.root.position.x = THREE.MathUtils.lerp(a.root.position.x, a.target.x, 0.03);
          a.root.position.z = THREE.MathUtils.lerp(a.root.position.z, a.target.z, 0.03);

          if (a.root.position.distanceTo(a.target) < 1.0) {
            a.state = 'walking';
          }
        } else {
          const dir = new THREE.Vector3().subVectors(a.target, a.root.position);
          dir.y = 0;

          if (dir.length() > 0.6) {
            dir.normalize();
            a.root.position.addScaledVector(dir, a.speed);
            const targetRot = Math.atan2(dir.x, dir.z);
            a.root.rotation.y = THREE.MathUtils.lerp(a.root.rotation.y, targetRot, 0.08);

            a.frontMesh.position.y = 1.8 + Math.abs(Math.sin(time * 8 + a.timeOffset)) * 0.4;
            a.frontMesh.rotation.z = Math.sin(time * 8 + a.timeOffset) * 0.12;
          } else {
            a.frontMesh.position.y = 1.8 + Math.sin(time * 2 + a.timeOffset) * 0.08;
            if (Math.random() < 0.01) {
              const b = BIOMES[a.biome];
              a.target.set(b.x + (Math.random() - 0.5) * 16, 0, b.z + (Math.random() - 0.5) * 16);
            }
          }
        }
      });
    }

    /* ==========================================================
       6. КЛИКИ, ФОКУС, КОРМЛЕНИЕ И РЕАКЦИИ
       ========================================================== */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const petBadge = document.getElementById('pet-badge');
    const badgeName = document.getElementById('badge-name');
    const badgeBiome = document.getElementById('badge-biome');

    window.addEventListener('pointerup', (e) => {
      if (e.target.closest('#draw-modal') || e.target.closest('.top-bar') || e.target.closest('#pet-badge')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(scene.children, true);
      let found = false;

      for (let hit of hits) {
        if (hit.object.userData && hit.object.userData.name) {
          const pet = hit.object.userData;
          selectedPet = pet;
          badgeName.textContent = pet.name;
          badgeBiome.textContent = BIOMES[pet.biome].name;
          petBadge.classList.add('active');

          soundPetJoy();
          spawnLoveParticles(pet.root.position);
          pet.root.position.y += 2.0; // Радостный прыжок

          controls.target.copy(pet.root.position);
          found = true;
          break;
        }
      }
      if (!found && e.clientY > 90) petBadge.classList.remove('active');
    });

    // Кнопка кормления
    document.getElementById('btn-feed-pet').onclick = () => {
      if (!selectedPet) return;
      soundEat();
      spawnLoveParticles(selectedPet.root.position);
      selectedPet.root.position.y += 1.6;
    };

    /* ==========================================================
       7. РЕЖИМ ФОТОАППАРАТА (SCREENSHOT DOWNLOAD)
       ========================================================== */
    document.getElementById('btn-photo').onclick = () => {
      initAudio();
      soundPetJoy();
      
      // Анимация вспышки
      const flash = document.getElementById('photo-flash');
      flash.style.opacity = '1';
      setTimeout(() => flash.style.opacity = '0', 250);

      // Скрываем плашку питомца перед съемкой
      petBadge.classList.remove('active');

      // Делаем рендер и скачиваем картинку
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      
      const a = document.createElement('a');
      a.download = 'my-zooo-pet.png';
      a.href = dataUrl;
      a.click();
    };

    /* ==========================================================
       8. СОХРАНЕНИЕ И СТАРТ
       ========================================================== */
    function saveToStorage() {
      const data = animals.map(a => ({
        name: a.name,
        biome: a.biome,
        img: a.frontMesh.material.map.image.src
      }));
      localStorage.setItem('zooo_save_data', JSON.stringify(data));
    }

    function loadFromStorage() {
      const raw = localStorage.getItem('zooo_save_data');
      if (raw) {
        try {
          const list = JSON.parse(raw);
          list.forEach(item => makeVolumetricAnimal(item.img, item.biome, item.name));
        } catch(e) {}
      }
    }

    const drawModal = document.getElementById('draw-modal');
    document.getElementById('btn-open-draw').onclick = () => {
      initAudio();
      drawModal.style.display = 'flex';
    };

    document.getElementById('btn-animate').onclick = () => {
      initAudio();
      const pData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const hasDrawing = pData.some((c, i) => i % 4 === 3 && c > 15);
      if (!hasDrawing) {
        alert("Нарисуй что-нибудь красивое перед оживлением!");
        return;
      }

      const name = document.getElementById('name-input').value.trim() || "Странник";
      const biome = document.getElementById('biome-input').value;
      const dataUrl = canvas.toDataURL();

      drawModal.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      soundMagic();
      controls.target.set(0, 1, 0);

      makeVolumetricAnimal(dataUrl, biome, name, (pet) => {
        saveToStorage();
        spawnLoveParticles(pet.root.position);
      });
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function loop() {
      requestAnimationFrame(loop);
      updateLivingWorld();
      controls.update();
      renderer.render(scene, camera);
    }

    loadFromStorage();
    loop();
  </script>
</body>
</html>
